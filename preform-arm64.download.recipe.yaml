---
Description: Download PreForm Apple Arm
Identifier: info.boltshauser.download.PreForm-arm64
Input:
    NAME: PreForm
Process:
    - Processor: URLDownloader
      Arguments:
          url: https://downloads.formlabs.com/PreForm/Release/preform-arm64.dmg
          filename: PreForm-arm64.dmg

    - Processor: Versioner
      Arguments:
          input_plist_path: "%pathname%/PreForm.app/Contents/Info.plist"

    - Processor: EndOfCheckPhase
