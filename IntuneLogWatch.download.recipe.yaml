---
Description: Download IntuneLogWatch
Identifier: net.pkpowell.download.IntuneLogWatch
Input:
    NAME: IntuneLogWatch
    GITHUB_REPO: gilburns/IntuneLogWatch
    ASSET_REGEX: '^IntuneLogWatch-[0-9]{8}-[0-9]+(\.[0-9]+)+\.dmg$'
Process:
    - Processor: GitHubReleasesInfoProvider
      Arguments:
          github_repo: "%GITHUB_REPO%"
          asset_regex: "%ASSET_REGEX%"

    - Processor: URLDownloader
      Arguments:
          filename: "%NAME%.dmg"

    - Processor: EndOfCheckPhase
