---
Description: Download Zed Arm
Identifier: net.pkpowell.download.Go-arm
Input:
    NAME: Go

Process:
    - Processor: URLTextSearcher
      Arguments:
          url: https://go.dev/dl/?mode=json
          re_pattern: '"filename":\s*"(go[^"]+\.darwin-arm64\.pkg)"'
          result_output_var_name: filename

    - Processor: URLDownloader
      Arguments:
          url: https://go.dev/dl/%filename%
          filename: "%filename%-arm.pkg"

    - Processor: EndOfCheckPhase
