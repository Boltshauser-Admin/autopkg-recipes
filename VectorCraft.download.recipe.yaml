---
Description: Download VectorCraft
Identifier: info.boltshauser.download.VectorCraft
Input:
    NAME: VectorCraft
    GITHUB_REPO: storytold/vectorcraft
    ASSET_REGEX: '^vectorcraft-[0-9]+(\.[0-9]+)+\-macos-universal.dmg$'
Process:
    - Processor: GitHubReleasesInfoProvider
      Arguments:
          github_repo: "%GITHUB_REPO%"
          asset_regex: "%ASSET_REGEX%"

    - Processor: URLDownloader
      Arguments:
          filename: "%NAME%.dmg"

    - Processor: EndOfCheckPhase
