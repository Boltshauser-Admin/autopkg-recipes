---
Description: Download PreForm Intel
Identifier: info.boltshauser.download.PreForm-x86
Input:
  NAME: PreForm
Process:
  - Processor: URLDownloader
    Arguments:
      url: https://downloads.formlabs.com/PreForm/Release/preform.dmg
      filename: PreForm-x86.dmg

  - Processor: AppDmgVersioner
    Arguments:
      dmg_path: "%pathname%"

  - Processor: EndOfCheckPhase
