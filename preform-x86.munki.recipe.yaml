Identifier: info.boltshauser.munki.PreForm-x86
Input:
  NAME: PreForm
ParentRecipe: info.boltshauser.download.PreForm-x86
ParentRecipeTrustInfo:
  non_core_processors: {}
  parent_recipes:
    info.boltshauser.download.PreForm-x86:
      git_hash: 9f13e1dfbf5ea00c148802d98c290da9bb1cbf51
      path: ~/dev/autopkg-recipes/preform-x86.download.recipe.yaml
      sha256_hash: 84bf4a8f052f48529eac3037b7cc8c923f29ee3aedb79ec199288ac5e80865bf
Process:
  - Arguments:
      extract_icon: true
      munkiimport_appname: PreForm.app
