        catalogs:
          - office
        description: PreForm for Intel Macs
        display_name: PreForm
        name: '%NAME%-x86'
        supported_architectures:
          - x86_64
        unattended_install: false
      repo_subdirectory: apps/PreForm
    Processor: MunkiImporter
