---
Description: Import Golang into Munki
Identifier: net.pkpowell.munki.Go-arm
ParentRecipe: net.pkpowell.download.Go-arm64
Input:
    NAME: Go
    pkginfo:
        name: "%NAME%"
        display_name: Golang
        description: Golang arm
        catalogs:
            - office
        unattended_install: true
        supported_architectures:
            - arm64
Process:
    - Processor: MunkiImporter
      Arguments:
          pkg_path: "%pathname%"
          repo_subdirectory: apps/Go

    - Processor: EndOfCheckPhase
