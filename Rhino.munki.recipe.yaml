---
Description: Import Rhino 8 into Munki
Identifier: net.pkpowell.munki.Rhino8
ParentRecipe: net.pkpowell.download.Rhino8

Input:
    NAME: Rhino8
    MUNKI_REPO_SUBDIR: apps/Rhino
    CATALOG: office
    pkginfo:
        name: "%NAME%"
        display_name: Rhino
        description: Rhinoceros
        developer: McNeel
        catalogs:
            - office
        # unattended_install: true

Process:
    - Processor: MunkiImporter
      Arguments:
          pkg_path: "%pathname%"
          munkiimport_appname: "Rhino 8.app"
          repo_subdirectory: "%MUNKI_REPO_SUBDIR%"
          catalog: "%CATALOG%"
          extract_icon: true

MinimumVersion: "2.7"
