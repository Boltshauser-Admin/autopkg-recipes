---
Description: Download OpenLogi Arm
Identifier: info.boltshauser.download.OpenLogi-arm
Input:
    NAME: OpenLogi
    GITHUB_REPO: AprilNEA/OpenLogi
    ASSET_REGEX: ".*-macos-arm64\\.dmg$"
Process:
    - Processor: GitHubReleasesInfoProvider
      Arguments:
          github_repo: "%GITHUB_REPO%"
          asset_regex: "%ASSET_REGEX%"

    - Processor: URLDownloader
      Arguments:
          filename: "%NAME%-arm.dmg"

    - Processor: EndOfCheckPhase
