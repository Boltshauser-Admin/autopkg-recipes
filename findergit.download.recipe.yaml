---
Description: Download FinderGit
Identifier: net.pkpowell.download.FinderGit
Input:
    NAME: FinderGit
    GITHUB_REPO: gfazioli/findergit-website
    ASSET_REGEX: "FinderGit\\.dmg$"
Process:
    - Processor: GitHubReleasesInfoProvider
      Arguments:
          github_repo: "%GITHUB_REPO%"
          asset_regex: "%ASSET_REGEX%"

    - Processor: URLDownloader
      Arguments:
          filename: "%NAME%.dmg"

    - Processor: EndOfCheckPhase
