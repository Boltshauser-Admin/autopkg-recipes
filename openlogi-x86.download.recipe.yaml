---
Description: Download OpenLogi x86
Identifier: info.boltshauser.download.OpenLogi-x86
Input:
    NAME: OpenLogi
    GITHUB_REPO: AprilNEA/OpenLogi
    ASSET_REGEX: ".*-macos-x86_64\\.dmg$"
Process:
    - Processor: GitHubReleasesInfoProvider
      Arguments:
          github_repo: "%GITHUB_REPO%"
          asset_regex: "%ASSET_REGEX%"

    - Processor: URLDownloader
      Arguments:
          filename: "%NAME%-x86.dmg"

    - Processor: EndOfCheckPhase
