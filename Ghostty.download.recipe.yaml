---

Description: Download Ghostty release
Identifier: net.pkpowell.download.Ghostty
MinimumVersion: '2.3'

Input:
    NAME: Ghostty
    APPCAST_URL: https://release.files.ghostty.org/appcast.xml

Process:
    - Processor: URLTextSearcher
      Arguments:
          url: '%APPCAST_URL%'
          re_pattern: '(?s).*<enclosure url="https://release\.files\.ghostty\.org/([^/]+)/Ghostty\.dmg"'
          result_output_var_name: version

    - Processor: URLDownloader
      Arguments:
          url: 'https://release.files.ghostty.org/%version%/Ghostty.dmg'
          filename: '%NAME%.dmg'

    - Processor: EndOfCheckPhase