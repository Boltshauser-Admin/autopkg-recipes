---
Description: Import Fish Shell into Munki
Identifier: info.boltshauser.munki.Fish
ParentRecipe: info.boltshauser.download.Fish
Input:
    NAME: Fish
    pkginfo:
        name: "%NAME%"
        display_name: Fish Shell
        description: Fish is a smart and user-friendly command line shell
        catalogs:
            - office
        unattended_install: true
Process:
    - Processor: MunkiImporter
      Arguments:
          pkg_path: "%pathname%"
          repo_subdirectory: apps/Fish

    - Processor: EndOfCheckPhase
