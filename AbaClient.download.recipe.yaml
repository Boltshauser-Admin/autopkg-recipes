---
Description: Download AbaClient for macOS
Identifier: ch.abacus.autopkg.download.AbaClient
Input:
  NAME: AbaClient
  DOWNLOAD_PAGE: https://downloads.abacus.ch/downloads/abaclient/
  DOWNLOAD_BASE_URL: https://downloads.abacus.ch/fileadmin/ablage/dokumente/05_abaclient/

Process:
  - Processor: URLTextSearcher
    Arguments:
      url: "%DOWNLOAD_PAGE%"
      re_pattern: 'abaclient-([0-9.]+)\.dmg'
      result_output_var_name: version

  - Processor: URLDownloader
    Arguments:
      url: "%DOWNLOAD_BASE_URL%abaclient-%version%.dmg"

  - Processor: EndOfCheckPhase

MinimumVersion: "2.7"