---
Description: Download Tailscale
Identifier: info.boltshauser.download.tailscale
MinimumVersion: "2.3"

Input:
    NAME: Tailscale

Process:
    - Processor: URLTextSearcher
      Arguments:
          url: "https://pkgs.tailscale.com/stable/?mode=json"
          re_pattern: '"universal-package":\s*"(?P<match>Tailscale-(?P<version>[\d\.]+)-macos\.pkg)"'

    - Processor: URLDownloader
      Arguments:
          url: "https://pkgs.tailscale.com/stable/%match%"
          filename: "%NAME%-%version%.pkg"

    - Processor: EndOfCheckPhase

    - Processor: CodeSignatureVerifier
      Arguments:
          input_path: "%pathname%"
          expected_authority_names:
              - "Developer ID Installer: Tailscale Inc. (W5364U7YZB)"
              - "Developer ID Certification Authority"
              - "Apple Root CA"
