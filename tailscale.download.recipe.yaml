Description: Download Tailscale
Identifier: info.boltshauser.download.tailscale
MinimumVersion: "2.3"

Input:
    NAME: Tailscale

Process:
    - Processor: URLTextSearcher
      Arguments:
          url: "https://pkgs.tailscale.com/stable"
          re_pattern: '(Tailscale-(?P&lt;version&gt;[\d\.]+)-macos\.zip)'

    - Processor: URLDownloader
      Arguments:
          url: "https://pkgs.tailscale.com/stable/%match%"
          filename: "%NAME%.zip"
          request_headers:
              "user-agent": "%USER_AGENT%"

    - Processor: EndOfCheckPhase

    - Processor: Unarchiver
      Arguments:
          purge_destination: true

    - Processor: CodeSignatureVerifier
      Arguments:
          input_path: "%RECIPE_CACHE_DIR%/%NAME%/Tailscale.app"
          requirement: 'anchor apple generic and identifier "io.tailscale.ipn.macsys" and (certificate leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = W5364U7YZB)'
          strict_verification: true
