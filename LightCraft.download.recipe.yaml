---
Description: Download LightCraft
Identifier: info.boltshauser.download.LightCraft
Input:
    NAME: LightCraft
    GITHUB_REPO: storytold/lightcraft
    ASSET_REGEX: '^lightcraft-[0-9]+(\.[0-9]+)+\-macos-universal.dmg$'
Process:
    - Processor: GitHubReleasesInfoProvider
      Arguments:
          github_repo: "%GITHUB_REPO%"
          asset_regex: "%ASSET_REGEX%"

    - Processor: URLDownloader
      Arguments:
          filename: "%NAME%.dmg"

    - Processor: EndOfCheckPhase
