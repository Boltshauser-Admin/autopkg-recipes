---
Description: Download LightCraft
Identifier: info.boltshauser.download.LightCraft
Input:
    NAME: PhotoCraft
    GITHUB_REPO: storytold/lightcraft
    ASSET_REGEX: "lightcraft-\\macos-universal.dmg$"
Process:
    - Processor: GitHubReleasesInfoProvider
      Arguments:
          github_repo: "%GITHUB_REPO%"
          asset_regex: "%ASSET_REGEX%"

    - Processor: URLDownloader
      Arguments:
          filename: "%NAME%.dmg"

    - Processor: EndOfCheckPhase
