---
Description: Import Gram arm into Munki
Identifier: info.boltshauser.munki.Gram-arm
ParentRecipe: info.boltshauser.download.Gram-arm
Input:
    NAME: Zed
    pkginfo:
        name: "%NAME%"
        display_name: Gram Editor
        description: Gram for arm
        catalogs:
            - office
        unattended_install: false
        supported_architectures:
            - arm64
Process:
    - Processor: MunkiImporter
      Arguments:
          pkg_path: "%pathname%"
          munkiimport_appname: Gram.app
          repo_subdirectory: apps/Gram
          extract_icon: true

    - Processor: EndOfCheckPhase
