---
Description: Download Golang Arm
Identifier: net.pkpowell.download.Go-x86
Input:
    NAME: Go

Process:
    - Processor: URLTextSearcher
      Arguments:
          url: https://go.dev/dl/?mode=json
          re_pattern: '"filename":\s*"(go[^"]+\.darwin-amd64\.pkg)"'
          result_output_var_name: filename

    - Processor: URLDownloader
      Arguments:
          url: https://go.dev/dl/%filename%
          filename: "%filename%-x86.pkg"

    - Processor: EndOfCheckPhase
