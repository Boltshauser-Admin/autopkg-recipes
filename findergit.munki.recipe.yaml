---
Description: Import FinderGit into Munki
Identifier: net.pkpowell.munki.FinderGit
ParentRecipe: net.pkpowell.download.FinderGit
Input:
    NAME: FinderGit
    pkginfo:
        name: "%NAME%"
        display_name: FinderGit
        description: FinderGit - native macOS Git-aware file browser
        catalogs:
            - office
        unattended_install: true
Process:
    - Processor: MunkiImporter
      Arguments:
          pkg_path: "%pathname%"
          repo_subdirectory: apps/FinderGit
          extract_icon: true

    - Processor: EndOfCheckPhase
