---
Description: Import OpenLogi Apple Arm into Munki
Identifier: info.boltshauser.munki.OpenLogi-arm
ParentRecipe: info.boltshauser.download.OpenLogi-arm
Input:
    NAME: OpenLogi
    pkginfo:
        name: "%NAME%"
        display_name: OpenLogi Logitech Driver
        description: OpenLogi for arm64
        catalogs:
            - office
        unattended_install: true
        supported_architectures:
            - arm64
Process:
    - Processor: MunkiImporter
      Arguments:
          pkg_path: "%pathname%"
          munkiimport_appname: OpenLogi.app
          repo_subdirectory: apps/OpenLogi
          extract_icon: true

    - Processor: EndOfCheckPhase
