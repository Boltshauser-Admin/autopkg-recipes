---
Description: Download DesignCraft
Identifier: info.boltshauser.download.DesignCraft
Input:
    NAME: DesignCraft
    GITHUB_REPO: storytold/designcraft
    ASSET_REGEX: '^designcraft-[0-9]+(\.[0-9]+)+\-macos-universal.dmg$'
Process:
    - Processor: GitHubReleasesInfoProvider
      Arguments:
          github_repo: "%GITHUB_REPO%"
          asset_regex: "%ASSET_REGEX%"

    - Processor: URLDownloader
      Arguments:
          filename: "%NAME%.dmg"

    - Processor: EndOfCheckPhase
